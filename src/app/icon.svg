<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#090d1a" />
  <circle cx="16" cy="12" r="8" fill="url(#aura)" />
  <!-- Vertical Beam -->
  <rect x="14" y="5" width="4" height="22" rx="2" fill="url(#gold)" />
  <!-- Horizontal Beam -->
  <rect x="6" y="10" width="20" height="4" rx="2" fill="url(#gold)" />
  <!-- Center Glint -->
  <circle cx="16" cy="12" r="1.5" fill="#ffffff" />
